# Access Transformer for kaleidoscope_startale.
#
# This file is at the DEFAULT location, so no build.gradle change is needed
# (ModDevGradle reads src/main/resources/META-INF/accesstransformer.cfg automatically).
# It IS still declared in neoforge.mods.toml via [[accessTransformers]], which is how
# NeoForge locates it at runtime.
#
# Entries use Mojang (official) mapping names, same as other NeoForge mods -- e.g.
# cookery's file has lines like "public net.minecraft.world.effect.MobEffectInstance duration".
#
# Why this is needed: Armadillo#scuteTime is private, and there is no public accessor.
# Feeding an armadillo has to shorten that timer so it sheds a scute sooner.
#
# Opening it up rather than using reflection is deliberate: reflection would need
# ObfuscationReflectionHelper to survive remapping, whereas an AT is resolved at load
# time and therefore fails loudly (with validateAccessTransformers = true in build.gradle,
# it fails the BUILD) instead of silently doing nothing.
public net.minecraft.world.entity.animal.armadillo.Armadillo scuteTime
