plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

// Optional local Maven repository, used only when net.neoforged:minecraft-dependencies was
// installed into ~/.m2 locally (it cannot always be resolved from the remote repos).
// Override with -Plocal_maven_repo=<path>; disable with -Plocal_maven_repo= (empty).
def localMavenRepoDir = file((project.findProperty('local_maven_repo') ?: new File(System.getProperty('user.home'), '.m2/repository').absolutePath) as String)

repositories {
    // Prefer locally cached artifacts (e.g. minecraft-dependencies installed into ~/.m2).
    mavenLocal()
    // net.neoforged:minecraft-dependencies lives in the mojang-meta repo, but moddev's
    // exclusiveContent points it at releases (404) and the forgecdn mirror rewrites
    // mojang-meta back to releases. Resolve ONLY this module from the local Maven repo
    // (where it was installed), enabling gradleMetadata so the .module file is read.
    // Skipped automatically when that directory does not exist (e.g. on CI).
    if (localMavenRepoDir.directory) {
        exclusiveContent {
            forRepository {
                maven {
                    url = localMavenRepoDir.toURI().toString()
                    metadataSources {
                        gradleMetadata()
                        mavenPom()
                    }
                }
            }
            filter {
                includeModule("net.neoforged", "minecraft-dependencies")
            }
        }
    }
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    // 阿里云公共镜像：Maven Central 的传递依赖（netty/guava 等）走它，直连可通、速度快
    maven { url = "https://maven.aliyun.com/repository/public" }
    mavenCentral()
    // Modrinth Maven for external mod dependencies (Kaleidoscope Cookery / Tavern).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // src/main/resources/META-INF/accesstransformer.cfg opens Armadillo#scuteTime
    // (feeding an armadillo has to shorten that timer). Fail the build instead of
    // silently ignoring a stale entry.
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // IDE 运行配置显示的名字（默认是首字母大写的 run 名，即 "Client"）
            ideName = 'runClient'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 游戏目录，插件默认值即为项目下的 run/
            gameDirectory = file('run')
            // 运行时内存，按需调整
            jvmArguments.addAll '-Xmx4G', '-Xms1G'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Hard (required) mod dependencies.
    // Must stay >= the versions declared in neoforge.mods.toml: Startale uses
    // cookery's BowlFoodBlockItem / FoodBiteBlock and tavern's DrinkBlock,
    // BottleBlockItem, JuiceBucketItem, ITrellis and JuiceFluidType.
    implementation "maven.modrinth:kaleidoscope-cookery:1.6.0-neoforge+mc1.21.1"
    implementation "maven.modrinth:kaleidoscopetavern:1.2.0-neoforge+mc1.21.1"

    // Optional compat (JEI recipe page, Jade entity tooltips). Compile-time only:
    // the classes under compat/ are referenced by nothing else and are loaded by
    // JEI's @JeiPlugin / Jade's @WailaPlugin annotation scanning, so a missing mod
    // at runtime simply means those tooltips never appear.
    // If resolution fails, replace the versions with the builds you actually use.
    // 注意：JEI 在 Modrinth 上 fabric/neoforge 共用同一个 version_number，
    // 按版本号解析会拿到 Fabric 构建（class_XXXX 符号）。这里用 neoforge 文件的版本 ID。
    compileOnly "maven.modrinth:jei:TxS03dKM" // jei-1.21.1-neoforge-19.21.0.247
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
