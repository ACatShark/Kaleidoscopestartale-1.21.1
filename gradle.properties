org.gradle.jvmargs=-Xmx1G -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 "-Dhttp.nonProxyHosts=localhost|127.0.0.1|*.minecraft.net" -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 本机没有系统 JDK，固定用复制到 C:\Users\1\.jdks\microsoft-jdk-21 的 Microsoft OpenJDK 21.0.7。
# 该目录同时是用户级 JAVA_HOME，gradlew.bat 启动 JVM 和 Gradle 编译都用它。
# 注意 properties 里必须用正斜杠，反斜杠是转义符。
org.gradle.java.home=C:/Users/1/.jdks/microsoft-jdk-21

# 本机代理（Clash 127.0.0.1:7890）。maven.neoforged.net 直连会超时，必须走代理。
# 若代理端口变化或换机器，删掉这 6 行即可。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
